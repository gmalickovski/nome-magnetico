# Painel staff do Nome Magnético no mesmo processo Node (127.0.0.1:4321).
# Não aplicar na VPS sem aprovação. Passo a passo: docs/devops/admin-host.md
#
# O certificado abaixo é exclusivo deste host. O includeSubDomains do www
# exige HTTPS válido aqui antes do DNS receber tráfego.

server {
    listen 80;
    listen [::]:80;
    server_name admin.nomemagnetico.com.br;
    return 301 https://admin.nomemagnetico.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nomemagnetico.com.br;

    ssl_certificate /etc/letsencrypt/live/admin.nomemagnetico.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nomemagnetico.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

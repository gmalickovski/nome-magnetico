name: CI Nome Magnético

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validar Lint, Guardrails, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Linter de Polling / Reload em loop (DEV-251)
        run: npm run lint:polling

      - name: Testes dos Guardrails do Shell (DEV-252)
        run: npm run test:guard

      - name: Testes Automatizados
        env:
          STRIPE_SECRET_KEY: sk_test_dummy
          PUBLIC_SUPABASE_URL: https://kbqrkkltjvmxomrgsrbc.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: npm test

      - name: Build da Aplicação
        env:
          PUBLIC_SUPABASE_URL: https://kbqrkkltjvmxomrgsrbc.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: npm run build
